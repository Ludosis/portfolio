profile: >-
  Technical Artist and 3D generalist with a decade of experience in AAA and
  indie game development, in both Unity and Unreal Engine. Best suited for
  small teams with broad scope: shaders, VFX, animation pipelines, asset
  optimization, tooling, procedural content, and any technical challenge the
  project surfaces. Years of QA work on large productions built a habit of
  asking why a problem exists, not just fixing it — and building processes so
  it doesn't recur. Picks up new tools, techniques, and codebases fast;
  currently using Claude Code and LLM workflows for tooling and pipeline
  problems. Comfortable at the deep end of a codebase or in a creative review.


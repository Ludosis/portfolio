<!doctype html>
<!-- Template for the per-project link previews in assets/img/og/<slug>.png.
     Filled from each project's front matter by pipeline/render-images.mjs via the
     query string (title, eyebrow, meta, img, fit); no img gives a text-only card, and
     fit=contain shows a diagram whole instead of cropping it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  :root { --paper: #F2EDE0; --ink: #211E18; --muted: #6B6353; --hair: #CDC4B0; --prussian: #29506D; --red: #A6402A; }
  html, body { margin: 0; }
  .card {
    position: relative; width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    background-color: var(--paper);
    background-image:
      linear-gradient(rgba(41,80,109,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(41,80,109,0.055) 1px, transparent 1px);
    background-size: 40px 40px;
    border: 3px solid var(--ink);
  }
  .corner { position: absolute; z-index: 2; width: 28px; height: 28px; border-color: var(--red); border-style: solid; }
  .corner.tl { top: 16px; left: 16px; border-width: 3px 0 0 3px; }
  .text { position: absolute; top: 70px; left: 70px; width: 470px; }
  .card.no-img .text { width: 1000px; }
  .eyebrow { font: 400 19px "IBM Plex Mono", monospace; letter-spacing: 0.2em; color: var(--red); text-transform: uppercase; }
  h1 { margin: 22px 0 0; font: 400 76px/1.0 "Newsreader", Georgia, serif; letter-spacing: -0.015em; color: var(--ink); }
  .meta { margin-top: 30px; display: flex; align-items: flex-start; gap: 18px; font: 400 21px/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.08em; color: var(--prussian); }
  .meta::before { content: ""; flex: none; width: 46px; margin-top: 15px; border-top: 2px solid var(--prussian); }
  .shot { position: absolute; top: 60px; right: 60px; width: 560px; height: 434px; border: 2px solid var(--ink); background: #EAE3D2; overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.no-img .shot { display: none; }
  .card.contain .shot { background: var(--paper); }
  .card.contain .shot img { object-fit: contain; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; border-top: 2px solid var(--hair); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; font: 400 19px "IBM Plex Mono", monospace; letter-spacing: 0.06em; color: var(--muted); }
  .foot b { color: var(--red); font-weight: 400; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="card">
  <div class="corner tl"></div>
  <div class="text">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="shot"><img id="img" alt=""></div>
  <div class="foot"><span><b>FIG. 00:</b> Jovian Finch Nordgren · Senior Technical Artist</span><span>JovianFinch.com</span></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("eyebrow").textContent = q.get("eyebrow") || "";
  document.getElementById("title").textContent = q.get("title") || "";
  document.getElementById("meta").textContent = q.get("meta") || "";
  if (q.get("img")) document.getElementById("img").src = q.get("img");
  else document.querySelector(".card").classList.add("no-img");
  if (q.get("fit") === "contain") document.querySelector(".card").classList.add("contain");
</script>
</body>
</html>
